name: Palgwae CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  distribution:
    name: build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python scripts/scan_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: palgwae-distributions
          path: dist/*
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts integrations/graphify/src integrations/graphify/tests
      - run: uv run python scripts/check_release.py
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run pip-audit --progress-spinner off
      - run: uv run --project integrations/graphify python -m unittest discover -s integrations/graphify/tests -v
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv run --isolated --no-project --with ./dist/palgwae-0.3.0-py3-none-any.whl python scripts/smoke_installed.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv run python scripts/prepare_npm.py
      - run: npm pack ./distributions/npm --pack-destination dist
      - run: node distributions/npm/bin/palgwae.mjs --version
