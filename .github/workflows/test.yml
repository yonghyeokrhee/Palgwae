name: Palgwae CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  distribution:
    name: build and inspect distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python scripts/scan_distributions.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: palgwae-distributions
          path: dist/*
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts integrations/graphify/src integrations/graphify/tests
      - run: uv run python scripts/check_release.py
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run pip-audit --progress-spinner off
      - run: uv run --project integrations/graphify python -m unittest discover -s integrations/graphify/tests -v
      - run: uv run python -m build
      - run: uv run twine check dist/*
      - run: uv run --isolated --no-project --with ./dist/palgwae-0.3.0-py3-none-any.whl python scripts/smoke_installed.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: uv run python scripts/prepare_npm.py
      - run: npm pack ./distributions/npm --pack-destination dist
      - run: node distributions/npm/bin/palgwae.mjs --version
