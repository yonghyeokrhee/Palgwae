[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palgwae"
version = "0.3.0"
description = "Bundled Palgwae runtime for the Codex plugin"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
palgwae = ["resources/*.py"]
