[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palgwae"
version = "0.3.0"
description = "Palgwae: evidence-bounded context graphs for data engineering repositories and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "yonghyeokrhee", email = "joshuaisland@gmail.com" },
]
keywords = [
  "palgwae",
  "data-engineering",
  "data-lineage",
  "knowledge-graph",
  "mcp",
  "rag",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp==1.28.1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.urls]
Documentation = "https://github.com/yonghyeokrhee/Palgwae#readme"
Issues = "https://github.com/yonghyeokrhee/Palgwae/issues"
Repository = "https://github.com/yonghyeokrhee/Palgwae"

[project.scripts]
palgwae = "palgwae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["build>=1.2,<2", "twine>=6,<7", "ruff>=0.12,<1", "jsonschema>=4.23,<5", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
palgwae = ["resources/*.py"]
