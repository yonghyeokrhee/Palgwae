[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palgwae"
version = "0.1.0"
description = "Palgwae: evidence-bounded context graphs for data engineering repositories and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Palgwae contributors" },
]
keywords = [
  "palgwae",
  "data-engineering",
  "data-lineage",
  "knowledge-graph",
  "mcp",
  "rag",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp==1.28.1",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.35,<1",
]

[project.urls]
Documentation = "https://github.com/yonghyeokrhee/Palgwae#readme"
Issues = "https://github.com/yonghyeokrhee/Palgwae/issues"
Repository = "https://github.com/yonghyeokrhee/Palgwae"

[project.scripts]
palgwae = "palgwae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
